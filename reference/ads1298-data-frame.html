<head>

  <title>ADS1298 数据帧速查</title>
  <link rel="stylesheet" href="../assets/lesson.css">
</head>
<body>
  <main>
    <h1>ADS1298 数据帧速查</h1>
    <p><strong>一次 DRDY↓ 不等于一个字节，而是一整帧已经准备好。</strong></p>
    <table>
      <thead><tr><th>顺序</th><th>内容</th><th>长度（常用数据率）</th></tr></thead>
      <tbody>
        <tr><td>0</td><td>状态字</td><td>3 字节</td></tr>
        <tr><td>1–8</td><td>CH1…CH8，24 位二补码，MSB 在前</td><td>每通道 3 字节</td></tr>
        <tr><td>总计</td><td>一个 8 通道样本时刻</td><td>27 字节 / 216 个 SCLK</td></tr>
      </tbody>
    </table>
    <p>27 字节适用于除 32 kSPS 与 64 kSPS 外的数据率；那两个高速率通道数据为 16 位，总帧为 19 字节。</p>
    <p>来源：<a href="https://www.ti.com/lit/ds/symlink/ads1298.pdf">TI ADS1298 datasheet, §§9.4.1.3 and 9.5.1</a>。</p>
  </main>
</body>
</html>
